services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jirapowerdb}
      POSTGRES_USER: ${POSTGRES_USER:-jirapower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jirapower_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jirapower} -d ${POSTGRES_DB:-jirapowerdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-jirapower}:${POSTGRES_PASSWORD:-jirapower_secret}@postgres:5432/${POSTGRES_DB:-jirapowerdb}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-https://task.ascvn.com.vn}
    volumes:
      - backend_data:/app/data
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://backend:3001
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  backend_data:
